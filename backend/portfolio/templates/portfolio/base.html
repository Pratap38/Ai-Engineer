<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Pratap{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Claude's actual palette tokens
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              // light
              'bg-000':  '#FFFFFF',
              'bg-100':  '#FAF9F5',
              'bg-200':  '#F5F4ED',
              'bg-300':  '#F0EEE6',
              'bg-400':  '#E8E6DC',
              'txt-100': '#1F1E1D',
              'txt-200': '#3D3D3A',
              'txt-300': '#6C6B68',
              'txt-400': '#91918D',
              'brd-200': '#E5E3DC',
              'brd-300': '#DAD9D4',
              // dark
              'd-bg-000':  '#0F0F0E',
              'd-bg-100':  '#1F1E1D',
              'd-bg-200':  '#262624',
              'd-bg-300':  '#30302E',
              'd-bg-400':  '#3A3A38',
              'd-txt-100': '#F5F4EE',
              'd-txt-200': '#E5E4DF',
              'd-txt-300': '#C2C0B6',
              'd-txt-400': '#91918D',
              'd-brd-200': '#333331',
              'd-brd-300': '#3E3E3B',
              // Claude coral
              'accent':      '#D97757',
              'accent-hov':  '#C25F3F',
            },
            fontFamily: {
              sans:  ['"Styrene B"', 'ui-sans-serif', 'system-ui', '-apple-system', '"Segoe UI"', 'Inter', 'Helvetica', 'sans-serif'],
              serif: ['Copernicus', 'Georgia', '"Times New Roman"', 'serif'],
            },
          }
        }
      }
    </script>
    <style>
        html, body { height: 100%; }
        body {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        /* Claude's thin, subtle scrollbar */
        .c-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
        .c-scroll::-webkit-scrollbar-track { background: transparent; }
        .c-scroll::-webkit-scrollbar-thumb {
            background: rgba(0,0,0,.15); border-radius: 9999px;
        }
        .dark .c-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); }
        .c-scroll { scrollbar-width: thin; scrollbar-color: rgba(0,0,0,.15) transparent; }
        .dark .c-scroll { scrollbar-color: rgba(255,255,255,.15) transparent; }

        .msg-in { animation: msgIn .28s cubic-bezier(.22,.61,.36,1) both; }
        @keyframes msgIn {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: none; }
        }

        /* assistant markdown-ish rendering */
        .prose-c { line-height: 1.7; }
        .prose-c p { margin: 0 0 1rem; }
        .prose-c p:last-child { margin-bottom: 0; }
        .prose-c strong { font-weight: 600; }
        .prose-c ul, .prose-c ol { margin: 0 0 1rem; padding-left: 1.5rem; }
        .prose-c ul { list-style: disc; }
        .prose-c ol { list-style: decimal; }
        .prose-c li { margin: .25rem 0; }
        .prose-c code {
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: .875em; padding: .15em .35em; border-radius: 4px;
            background: #F0EEE6;
        }
        .dark .prose-c code { background: #30302E; }

        .dot { animation: blink 1.4s infinite both; }
        .dot:nth-child(2) { animation-delay: .2s; }
        .dot:nth-child(3) { animation-delay: .4s; }
        @keyframes blink { 0%,80%,100% { opacity:.25 } 40% { opacity:1 } }
    </style>
    <script>
      // theme before paint, avoids flash
      (function () {
        var t = localStorage.getItem('theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
</head>
<body class="h-full bg-bg-100 dark:bg-d-bg-200 text-txt-100 dark:text-d-txt-100 font-sans antialiased">
    {% block content %}{% endblock %}

    <script>
      function toggleTheme() {
        var r = document.documentElement;
        r.classList.toggle('dark');
        localStorage.setItem('theme', r.classList.contains('dark') ? 'dark' : 'light');
      }
    </script>
</body>
</html>
